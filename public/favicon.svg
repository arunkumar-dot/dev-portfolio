<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080d"/>
      <stop offset="100%" stop-color="#0d1527"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Squircle Dark Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-opacity="0.5"/>
  
  <!-- AKK Monogram Stylized Letterforms -->
  <!-- 'A' Letterform -->
  <path d="M14 47 L25 17 L36 47 M18 39 L32 39" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- 'K' Letterform -->
  <path d="M42 17 L42 47 M42 32 L54 17 M44 29 L54 47" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Glowing Status Telemetry Indicator -->
  <circle cx="53" cy="12" r="3.5" fill="#00f5d4" filter="url(#glow)"/>
</svg>
