<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="prismTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="prismRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="prismLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <!-- Dark Obsidian Container -->
  <rect width="32" height="32" rx="8" fill="#06080d"/>
  
  <!-- 3D Anti-Gravity Spatial Prism / Hex Node -->
  <!-- Top Facet -->
  <polygon points="16,5 26,11 16,17 6,11" fill="url(#prismTop)"/>
  
  <!-- Right Facet -->
  <polygon points="16,17 26,11 26,22 16,28" fill="url(#prismRight)"/>
  
  <!-- Left Facet -->
  <polygon points="6,11 16,17 16,28 6,22" fill="url(#prismLeft)"/>
  
  <!-- Precision Vertex Outlines -->
  <polyline points="6,11 16,17 26,11" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.6"/>
  <line x1="16" y1="17" x2="16" y2="28" stroke="#00f5d4" stroke-width="0.75" stroke-opacity="0.8"/>
  
  <!-- Glowing Core Light Dot -->
  <circle cx="16" cy="11" r="1.5" fill="#ffffff"/>
</svg>
